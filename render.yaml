services:
  - type: web
    name: smart-tire-api
    env: docker
    repo: https://github.com/danuphonChatphueak/Smart_Tire.git
    branch: master
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free # Can upgrade to starter/standard if out of memory
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /docs
